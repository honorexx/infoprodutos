name: infoprodutos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-infoprodutos}
      POSTGRES_USER: ${DB_USER:-infoprodutos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-infoprodutos}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - infoprodutos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-infoprodutos} -d ${DB_NAME:-infoprodutos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-infoprodutos}
      DB_USER: ${DB_USER:-infoprodutos}
      DB_PASSWORD: ${DB_PASSWORD:-infoprodutos}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env (minimo 32 bytes aleatorios)}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8080}
      VIDEO_STORAGE_LOCAL_ROOT: /data/videos
      CERTIFICATE_STORAGE_LOCAL_ROOT: /data/certificates
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_MOCK_WHEN_TOKEN_BLANK: ${MP_MOCK_WHEN_TOKEN_BLANK:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: "${MAIL_FROM:-PKS Consultoria <onboarding@resend.dev>}"
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-true}
      DEV_SEED_ADMIN_EMAIL: ${DEV_SEED_ADMIN_EMAIL:-admin@dev.local}
      DEV_SEED_ADMIN_PASSWORD: ${DEV_SEED_ADMIN_PASSWORD:-}
      DEV_SEED_INSTRUCTOR_EMAIL: ${DEV_SEED_INSTRUCTOR_EMAIL:-instrutor@dev.local}
      DEV_SEED_INSTRUCTOR_PASSWORD: ${DEV_SEED_INSTRUCTOR_PASSWORD:-}
      DEV_SEED_STUDENT_EMAIL: ${DEV_SEED_STUDENT_EMAIL:-aluno@dev.local}
      DEV_SEED_STUDENT_PASSWORD: ${DEV_SEED_STUDENT_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Persistência de mídia/PDFs fora do container (reiniciar a API não apaga uploads)
      - ./data/videos:/data/videos
      - ./data/certificates:/data/certificates
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  infoprodutos_pgdata:
