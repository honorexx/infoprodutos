spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

server:
  # Railway/Vercel encaminham o IP real; o container normaliza os headers antes
  # de o rate limiter consultar request.remoteAddr.
  forward-headers-strategy: native

app:
  cookie:
    secure: ${COOKIE_SECURE:true}
  mercadopago:
    # Em produção nunca cair no mock por acidente.
    mock-when-token-blank: ${MP_MOCK_WHEN_TOKEN_BLANK:false}
  dev-seed:
    # Nunca habilitado em produção: seeds de desenvolvimento não podem existir fora de dev/local.
    enabled: false

logging:
  level:
    root: INFO
    com.infoprodutos: INFO
