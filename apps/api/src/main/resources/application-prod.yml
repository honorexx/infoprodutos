spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  cookie:
    secure: ${COOKIE_SECURE:true}
  dev-seed:
    # Nunca habilitado em produção: seeds de desenvolvimento não podem existir fora de dev/local.
    enabled: false

logging:
  level:
    root: INFO
    com.infoprodutos: INFO
