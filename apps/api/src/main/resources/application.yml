spring:
  application:
    name: infoprodutos-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # O armazenamento do container é efêmero e o espaço livre não representa
    # a saúde da API. Banco e aplicação continuam participando do resultado.
    diskspace:
      enabled: false

spring.servlet.multipart:
  # PROXY/local only — em produção com R2 o vídeo não passa pela API.
  max-file-size: ${MULTIPART_MAX_FILE_SIZE:2GB}
  max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:2GB}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs/swagger-ui

app:
  jwt:
    # Segredo NUNCA tem valor default em código: deve ser fornecido via variável de ambiente.
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  api:
    public-base-url: ${API_PUBLIC_BASE_URL:http://localhost:8080}
  video-storage:
    local-root: ${VIDEO_STORAGE_LOCAL_ROOT:./data/videos}
    # 2 GiB default — aulas longas (20+ min). Em R2 o limite prático é o plano do bucket.
    max-file-bytes: ${VIDEO_STORAGE_MAX_FILE_BYTES:2147483648}
    stream-url-ttl-seconds: ${VIDEO_STREAM_URL_TTL_SECONDS:300}
    s3:
      # Cloudflare R2 (ou S3/MinIO). enabled=true → upload DIRECT via URL assinada.
      enabled: ${VIDEO_S3_ENABLED:false}
      endpoint: ${VIDEO_S3_ENDPOINT:}
      region: ${VIDEO_S3_REGION:auto}
      bucket: ${VIDEO_S3_BUCKET:}
      access-key: ${VIDEO_S3_ACCESS_KEY:}
      secret-key: ${VIDEO_S3_SECRET_KEY:}
      public-base-url: ${VIDEO_S3_PUBLIC_BASE_URL:}
      upload-url-ttl-seconds: ${VIDEO_S3_UPLOAD_URL_TTL_SECONDS:3600}
      download-url-ttl-seconds: ${VIDEO_S3_DOWNLOAD_URL_TTL_SECONDS:300}
  certificate:
    storage-local-root: ${CERTIFICATE_STORAGE_LOCAL_ROOT:./data/certificates}
    public-web-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    coordinator-name: ${CERTIFICATE_COORDINATOR_NAME:Rafael Kienen}
    chief-vision-officer-name: ${CERTIFICATE_CVO_NAME:Pedro Honorio}
  ai:
    provider: ${AI_PROVIDER:mock}
    max-attempts: ${AI_JOB_MAX_ATTEMPTS:3}
    stuck-timeout-minutes: ${AI_JOB_STUCK_TIMEOUT_MINUTES:15}
    stuck-check-interval-ms: ${AI_JOB_STUCK_CHECK_INTERVAL_MS:60000}
    default-question-count: ${AI_DEFAULT_QUESTION_COUNT:5}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
    api-base-url: ${MP_API_BASE_URL:https://api.mercadopago.com}
    # Sem token: CheckoutService usa mock (simulate-payment). Em prod defina MP_ACCESS_TOKEN.
    mock-when-token-blank: ${MP_MOCK_WHEN_TOKEN_BLANK:true}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: "${MAIL_FROM:PKS Consultoria <onboarding@resend.dev>}"
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:false}
    admin-email: ${DEV_SEED_ADMIN_EMAIL:}
    admin-password: ${DEV_SEED_ADMIN_PASSWORD:}
    instructor-email: ${DEV_SEED_INSTRUCTOR_EMAIL:}
    instructor-password: ${DEV_SEED_INSTRUCTOR_PASSWORD:}
    student-email: ${DEV_SEED_STUDENT_EMAIL:}
    student-password: ${DEV_SEED_STUDENT_PASSWORD:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
